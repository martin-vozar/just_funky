name: Deploy icons to GitHub Pages

on:
  push:
    branches: [claude/uri-abstraction-public-repo-dj7mlf]
    paths:
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires Pages to already exist with Source = "GitHub Actions"
      # (Settings > Pages). Creating the site from here is not possible:
      # the Pages create API needs administration:write, which GITHUB_TOKEN
      # cannot hold, so configure-pages' enablement:true always 403s.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
